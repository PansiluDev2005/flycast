<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" fill="#f8fafc"/>
  <rect width="1200" height="860" fill="url(#grid2)"/>

  <!-- Top System Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a"/>
  <g transform="translate(30, 16)">
    <rect x="0" y="4" width="20" height="20" rx="4" fill="#0284c7"/>
    <path d="M 4 14 L 10 8 L 16 12 L 14 16 L 4 14 Z" fill="#ffffff"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">FLYCAST</text>
    <text x="105" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">| Aviation Intelligence Platform</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(420, 22)">
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Home</text>
    <text x="70" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Predictor</text>
    <rect x="150" y="-4" width="84" height="28" rx="6" fill="#1e293b"/>
    <text x="163" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Watchlist</text>
    <text x="260" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Operations Hub</text>
    <text x="385" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Admin</text>
  </g>

  <!-- User Profile Badge -->
  <g transform="translate(1010, 15)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="8" fill="#0284c7"/>
    <text x="32" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">jdoe123 (Passenger)</text>
  </g>

  <!-- Page Header & Action -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="295" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#0284c7"/>
    <text x="24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">WF-02 • PASSENGER ITINERARY WATCHLIST</text>
    
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Digital Boarding Pass &amp; Watchlist Hub</text>
    <text x="0" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Persistent synchronized flight records, wheels-up countdowns, and real-time ML risk updates</text>
  </g>

  <!-- Evaluate New Flight CTA -->
  <g transform="translate(970, 95)">
    <rect x="0" y="0" width="190" height="42" rx="8" fill="url(#skyGrad2)"/>
    <text x="25" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">+ Add Flight to Watchlist</text>
  </g>

  <!-- KPI Summary Ribbon -->
  <g transform="translate(40, 175)">
    <g filter="url(#cardShadow2)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="265" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">ACTIVE MONITORED FLIGHTS</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#0f172a">2 Itineraries</text>

      <!-- KPI 2 -->
      <rect x="285" y="0" width="265" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">ON-TIME EXPECTED</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#10b981">1 Flight (50%)</text>

      <!-- KPI 3 -->
      <rect x="570" y="0" width="265" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">HIGH DELAY RISK FLAGGED</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#ef4444">1 Flight (50%)</text>

      <!-- KPI 4 -->
      <rect x="855" y="0" width="265" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">SMART TRAVEL ALERTS</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#0284c7">2 Active Buffers</text>
    </g>
  </g>

  <!-- ================= MAIN SECTION: WATCHLIST CARDS ================= -->
  <g transform="translate(40, 275)">
    
    <!-- Left Column: Flight Watchlist Itinerary Cards (750px width) -->
    <g>
      
      <!-- CARD 1: On-Time Flight (UL503) -->
      <g filter="url(#cardShadow2)">
        <rect x="0" y="0" width="750" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        
        <!-- Card Top Bar -->
        <rect x="0" y="0" width="750" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="22" cy="21" r="6" fill="#10b981"/>
        <text x="36" y="26" font-family="monospace" font-size="13" font-weight="800" fill="#0f172a">🇱🇰 SriLankan Airlines • UL503</text>
        <text x="270" y="25" font-family="system-ui" font-size="12" font-weight="500" fill="#64748b">Aug 25, 2026 • Scheduled 13:00</text>
        
        <!-- Countdown Pill -->
        <rect x="520" y="8" width="130" height="26" rx="13" fill="#e0f2fe"/>
        <text x="532" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">⏳ T - 10h 28m</text>

        <!-- Delete Action -->
        <rect x="665" y="8" width="70" height="26" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="678" y="25" font-family="system-ui" font-size="11" font-weight="700" fill="#b91c1c">Remove</text>

        <!-- Card Body -->
        <g transform="translate(25, 60)">
          <!-- Route Visualizer -->
          <g transform="translate(0, 10)">
            <text x="0" y="22" font-family="monospace" font-size="22" font-weight="900" fill="#0f172a">CMB</text>
            <text x="0" y="38" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">Colombo Intl</text>

            <!-- Middle Path -->
            <line x1="75" y1="20" x2="245" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,3"/>
            <circle cx="160" cy="20" r="12" fill="#e0f2fe"/>
            <text x="154" y="24" font-family="system-ui" font-size="12" font-weight="700" fill="#0284c7">✈</text>
            <text x="120" y="42" font-family="monospace" font-size="10" font-weight="700" fill="#64748b">5,410 MILES</text>

            <text x="260" y="22" font-family="monospace" font-size="22" font-weight="900" fill="#0f172a">LHR</text>
            <text x="260" y="38" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">London Heathrow</text>
          </g>

          <!-- Delay Risk Assessment Badge -->
          <g transform="translate(420, 5)">
            <rect x="0" y="0" width="280" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
            <text x="15" y="22" font-family="system-ui" font-size="10" font-weight="700" fill="#047857">AI DELAY INFERENCE</text>
            <text x="15" y="45" font-family="monospace" font-size="16" font-weight="900" fill="#065f46">38% Risk (On Time Expected)</text>
            <text x="220" y="32" font-family="monospace" font-size="12" font-weight="800" fill="#047857">0m Hold</text>
          </g>

          <!-- Smart Travel Recommendation Banner inside card -->
          <g transform="translate(0, 80)">
            <rect x="0" y="0" width="700" height="75" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
            <text x="15" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="#0369a1">SMART TRAVEL DEPARTURE GUIDANCE</text>
            <text x="15" y="44" font-family="system-ui" font-size="14" font-weight="800" fill="#0c4a6e">Optimal Home Departure: 10:15 AM (Arrive terminal 2h 45m prior to pushback)</text>
            <text x="15" y="62" font-family="monospace" font-size="10" font-weight="600" fill="#0284c7">🚗 45m Travel to BIA Katunayake • 🛂 60m Baggage &amp; TSA Checkpoint • 🚶 60m Gate Buffer</text>
          </g>
        </g>
      </g>

      <!-- CARD 2: Delayed Flight (UL225) -->
      <g transform="translate(0, 255)" filter="url(#cardShadow2)">
        <rect x="0" y="0" width="750" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        
        <!-- Card Top Bar -->
        <rect x="0" y="0" width="750" height="42" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <circle cx="22" cy="21" r="6" fill="#ef4444"/>
        <text x="36" y="26" font-family="monospace" font-size="13" font-weight="800" fill="#0f172a">🇱🇰 SriLankan Airlines • UL225</text>
        <text x="270" y="25" font-family="system-ui" font-size="12" font-weight="500" fill="#64748b">Aug 25, 2026 • Scheduled 18:45</text>
        
        <!-- Countdown Pill -->
        <rect x="520" y="8" width="130" height="26" rx="13" fill="#fee2e2"/>
        <text x="532" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#b91c1c">⏳ T - 16h 13m</text>

        <!-- Delete Action -->
        <rect x="665" y="8" width="70" height="26" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
        <text x="678" y="25" font-family="system-ui" font-size="11" font-weight="700" fill="#b91c1c">Remove</text>

        <!-- Card Body -->
        <g transform="translate(25, 60)">
          <!-- Route Visualizer -->
          <g transform="translate(0, 10)">
            <text x="0" y="22" font-family="monospace" font-size="22" font-weight="900" fill="#0f172a">CMB</text>
            <text x="0" y="38" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">Colombo Intl</text>

            <!-- Middle Path -->
            <line x1="75" y1="20" x2="245" y2="20" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,3"/>
            <circle cx="160" cy="20" r="12" fill="#fee2e2"/>
            <text x="154" y="24" font-family="system-ui" font-size="12" font-weight="700" fill="#ef4444">✈</text>
            <text x="120" y="42" font-family="monospace" font-size="10" font-weight="700" fill="#64748b">2,045 MILES</text>

            <text x="260" y="22" font-family="monospace" font-size="22" font-weight="900" fill="#0f172a">DXB</text>
            <text x="260" y="38" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">Dubai Intl</text>
          </g>

          <!-- Delay Risk Assessment Badge -->
          <g transform="translate(420, 5)">
            <rect x="0" y="0" width="280" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
            <text x="15" y="22" font-family="system-ui" font-size="10" font-weight="700" fill="#b91c1c">CRITICAL DELAY PROJECTED</text>
            <text x="15" y="45" font-family="monospace" font-size="16" font-weight="900" fill="#991b1b">74% Risk (+35m Hold Time)</text>
            <text x="220" y="32" font-family="monospace" font-size="12" font-weight="800" fill="#ef4444">+35 min</text>
          </g>

          <!-- Smart Travel Recommendation Banner inside card -->
          <g transform="translate(0, 80)">
            <rect x="0" y="0" width="700" height="75" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
            <text x="15" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="#b45309">AIRLINE SCHEDULE ADJUSTMENT NOTICE</text>
            <text x="15" y="44" font-family="system-ui" font-size="14" font-weight="800" fill="#78350f">Adjusted Target Departure: 16:30 PM (Air traffic congestion expected at DXB)</text>
            <text x="15" y="62" font-family="monospace" font-size="10" font-weight="600" fill="#d97706">⚠️ Evening corridor peak hours may extend gate boarding. Stay tuned to terminal displays.</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Column: Destination Intelligence & Travel Tips Box (340px width) -->
    <g transform="translate(780, 0)" filter="url(#cardShadow2)">
      <rect x="0" y="0" width="340" height="490" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="36" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#475569">DESTINATION INTELLIGENCE</text>

      <!-- Weather Overview Box -->
      <g transform="translate(20, 55)">
        <text x="0" y="0" font-family="system-ui" font-size="12" font-weight="700" fill="#334155">DESTINATION WEATHER METRICS</text>
        
        <!-- London Weather -->
        <rect x="0" y="10" width="300" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="32" font-family="monospace" font-size="14" font-weight="800" fill="#0f172a">LHR • London</text>
        <text x="14" y="52" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">19°C • Partly Cloudy (Wind: 8 kts)</text>
        <text x="230" y="42" font-family="monospace" font-size="20" font-weight="700" fill="#0284c7">⛅ 19°</text>

        <!-- Dubai Weather -->
        <rect x="0" y="90" width="300" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="112" font-family="monospace" font-size="14" font-weight="800" fill="#0f172a">DXB • Dubai</text>
        <text x="14" y="132" font-family="system-ui" font-size="11" font-weight="500" fill="#64748b">38°C • Clear Skies (Wind: 14 kts)</text>
        <text x="230" y="122" font-family="monospace" font-size="20" font-weight="700" fill="#f59e0b">☀️ 38°</text>
      </g>

      <!-- Baggage & Airport Checklist -->
      <g transform="translate(20, 245)">
        <text x="0" y="0" font-family="system-ui" font-size="12" font-weight="700" fill="#334155">DEPARTURE CHECKLIST</text>
        
        <g transform="translate(0, 12)">
          <rect x="0" y="0" width="300" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="12" y="24" font-family="system-ui" font-size="12" font-weight="600" fill="#065f46">✔ Passport Validity &gt; 6 Months</text>
        </g>
        <g transform="translate(0, 60)">
          <rect x="0" y="0" width="300" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="12" y="24" font-family="system-ui" font-size="12" font-weight="600" fill="#065f46">✔ Electronic Boarding Pass Synced</text>
        </g>
        <g transform="translate(0, 108)">
          <rect x="0" y="0" width="300" height="40" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
          <text x="12" y="24" font-family="system-ui" font-size="12" font-weight="600" fill="#0369a1">ℹ️ Terminal 1 Baggage Drop Closes 60m Prior</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer Wireframe Tag -->
  <g transform="translate(40, 825)">
    <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">Flycast Blueprint Reference: src/pages/PassengerDashboard.jsx • Endpoint: GET/POST/DELETE /api/watchlist</text>
    <text x="1050" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#0284c7">WIRE_V1.0_APPROVED</text>
  </g>
</svg>
