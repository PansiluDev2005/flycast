<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <filter id="cardShadow5" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8fafc"/>
  <rect width="1200" height="820" fill="url(#grid5)"/>

  <!-- Top System Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a"/>
  <g transform="translate(30, 16)">
    <rect x="0" y="4" width="20" height="20" rx="4" fill="#0284c7"/>
    <path d="M 4 14 L 10 8 L 16 12 L 14 16 L 4 14 Z" fill="#ffffff"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">FLYCAST</text>
    <text x="105" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">| Aviation Intelligence Platform</text>
  </g>

  <!-- Page Header -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#0284c7"/>
    <text x="24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">WF-05 • SYSTEM INFORMATION ARCHITECTURE</text>
    
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a">System Navigation &amp; RBAC Information Flow Blueprint</text>
    <text x="0" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Hierarchy of user roles, page route trees, JWT access gates, and microservice communication topologies</text>
  </g>

  <!-- ================= TIER 1: USER ACTORS & ENTRY GATES ================= -->
  <g transform="translate(40, 170)">
    
    <!-- Actor 1: Passenger -->
    <g filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="90" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="260" height="28" rx="10" fill="#e0f2fe"/>
      <circle cx="18" cy="14" r="5" fill="#0284c7"/>
      <text x="30" y="18" font-family="system-ui" font-size="11" font-weight="800" fill="#0369a1">ROLE: PASSENGER (B2C)</text>
      <text x="14" y="50" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Travelers, Commuters</text>
      <text x="14" y="70" font-family="monospace" font-size="10" fill="#64748b">Auth: JWT (Role: Passenger)</text>
    </g>

    <!-- Actor 2: Dispatcher -->
    <g transform="translate(285, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="90" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="0" y="0" width="260" height="28" rx="10" fill="#fef3c7"/>
      <circle cx="18" cy="14" r="5" fill="#f59e0b"/>
      <text x="30" y="18" font-family="system-ui" font-size="11" font-weight="800" fill="#b45309">ROLE: DISPATCHER (B2B)</text>
      <text x="14" y="50" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Airlines Operations Ground Crew</text>
      <text x="14" y="70" font-family="monospace" font-size="10" fill="#64748b">Auth: JWT (Role: Dispatcher)</text>
    </g>

    <!-- Actor 3: Admin -->
    <g transform="translate(570, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="90" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="0" y="0" width="260" height="28" rx="10" fill="#ede9fe"/>
      <circle cx="18" cy="14" r="5" fill="#8b5cf6"/>
      <text x="30" y="18" font-family="system-ui" font-size="11" font-weight="800" fill="#6d28d9">ROLE: ADMINISTRATOR</text>
      <text x="14" y="50" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Executive &amp; System Engineers</text>
      <text x="14" y="70" font-family="monospace" font-size="10" fill="#64748b">Auth: JWT (Role: Admin)</text>
    </g>

    <!-- Public / Guest -->
    <g transform="translate(855, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="265" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="0" y="0" width="265" height="28" rx="10" fill="#f1f5f9"/>
      <circle cx="18" cy="14" r="5" fill="#64748b"/>
      <text x="30" y="18" font-family="system-ui" font-size="11" font-weight="800" fill="#475569">ROLE: GUEST / PUBLIC</text>
      <text x="14" y="50" font-family="system-ui" font-size="12" font-weight="700" fill="#0f172a">Unauthenticated Visitors</text>
      <text x="14" y="70" font-family="monospace" font-size="10" fill="#64748b">Auth: Public / 1-Click Login</text>
    </g>
  </g>

  <!-- Flow Connector Lines Tier 1 to Tier 2 -->
  <g transform="translate(40, 260)">
    <line x1="130" y1="0" x2="130" y2="40" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="415" y1="0" x2="415" y2="40" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="700" y1="0" x2="700" y2="40" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="987" y1="0" x2="987" y2="40" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- ================= TIER 2: REACT ROUTING & VIEWS ================= -->
  <g transform="translate(40, 300)">
    
    <!-- Group: Passenger Routes -->
    <g filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="260" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#0369a1">PASSENGER VIEWS</text>

      <!-- View 1: Predictor -->
      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="230" height="75" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="10" y="22" font-family="monospace" font-size="11" font-weight="800" fill="#0369a1">/predictor</text>
        <text x="10" y="42" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Flight Delay Predictor</text>
        <text x="10" y="60" font-family="system-ui" font-size="10" fill="#64748b">HUD Gauge, Trajectory, Travel Planner</text>
      </g>

      <!-- View 2: Watchlist -->
      <g transform="translate(15, 135)">
        <rect x="0" y="0" width="230" height="75" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="10" y="22" font-family="monospace" font-size="11" font-weight="800" fill="#0369a1">/passenger</text>
        <text x="10" y="42" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Digital Boarding Pass</text>
        <text x="10" y="60" font-family="system-ui" font-size="10" fill="#64748b">Active countdowns, delay tracking</text>
      </g>
    </g>

    <!-- Group: Dispatcher Routes -->
    <g transform="translate(285, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="260" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#b45309">DISPATCHER VIEWS</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="230" height="165" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
        <text x="10" y="22" font-family="monospace" font-size="11" font-weight="800" fill="#b45309">/dashboard</text>
        <text x="10" y="42" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Operations Command</text>
        <text x="10" y="65" font-family="system-ui" font-size="10" fill="#64748b">• CSV Bulk Schedule Ingestion</text>
        <text x="10" y="85" font-family="system-ui" font-size="10" fill="#64748b">• Recharts Fleet Congestion Bars</text>
        <text x="10" y="105" font-family="system-ui" font-size="10" fill="#64748b">• Manifest Triage Action Matrix</text>
        <text x="10" y="125" font-family="system-ui" font-size="10" fill="#64748b">• Tactical Crew Alerts &amp; Gate Shift</text>
        <text x="10" y="145" font-family="system-ui" font-size="10" fill="#64748b">• Incoming Admin Directives</text>
      </g>
    </g>

    <!-- Group: Admin Routes -->
    <g transform="translate(570, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="260" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="260" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#6d28d9">ADMIN VIEWS</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="230" height="165" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
        <text x="10" y="22" font-family="monospace" font-size="11" font-weight="800" fill="#6d28d9">/admin</text>
        <text x="10" y="42" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Governance &amp; ML Ops</text>
        <text x="10" y="65" font-family="system-ui" font-size="10" fill="#64748b">• Microservice Telemetry KPIs</text>
        <text x="10" y="85" font-family="system-ui" font-size="10" fill="#64748b">• Global Flight Prediction Stream</text>
        <text x="10" y="105" font-family="system-ui" font-size="10" fill="#64748b">• 1-Click Operational Directive</text>
        <text x="10" y="125" font-family="system-ui" font-size="10" fill="#64748b">• User RBAC Access Matrix</text>
        <text x="10" y="145" font-family="system-ui" font-size="10" fill="#64748b">• Asynchronous Model Retrain</text>
      </g>
    </g>

    <!-- Group: Public Routes -->
    <g transform="translate(855, 0)" filter="url(#cardShadow5)">
      <rect x="0" y="0" width="265" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="265" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#475569">PUBLIC VIEWS</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="235" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#475569">/</text>
        <text x="10" y="38" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">Home Landing &amp; Sandbox</text>
      </g>
      <g transform="translate(15, 105)">
        <rect x="0" y="0" width="235" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#475569">/login</text>
        <text x="10" y="38" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">JWT Login (1-Click Presets)</text>
      </g>
      <g transform="translate(15, 165)">
        <rect x="0" y="0" width="235" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="11" font-weight="800" fill="#475569">/register</text>
        <text x="10" y="38" font-family="system-ui" font-size="11" font-weight="700" fill="#0f172a">User Registration Portal</text>
      </g>
    </g>
  </g>

  <!-- ================= TIER 3: MICROSERVICES & PERSISTENCE ================= -->
  <g transform="translate(40, 560)">
    
    <!-- Flow Connector Lines Tier 2 to Tier 3 -->
    <line x1="560" y1="-30" x2="560" y2="10" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- API Gateway Box (Node.js 5000) -->
    <g filter="url(#cardShadow5)">
      <rect x="0" y="10" width="1120" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="10" width="1120" height="34" rx="12" fill="#1e293b"/>
      <circle cx="20" cy="27" r="5" fill="#10b981"/>
      <text x="32" y="31" font-family="monospace" font-size="11" font-weight="800" fill="#f8fafc">POLYGLOT MICROSERVICES ARCHITECTURE &amp; INTER-SERVICE PIPELINE</text>

      <!-- Node API Gateway Box -->
      <g transform="translate(25, 60)">
        <rect x="0" y="0" width="340" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui" font-size="12" font-weight="800" fill="#38bdf8">NODE.JS EXPRESS API GATEWAY (5000)</text>
        <text x="15" y="46" font-family="monospace" font-size="10" fill="#94a3b8">• JWT Authentication &amp; RBAC Guard</text>
        <text x="15" y="64" font-family="monospace" font-size="10" fill="#94a3b8">• /api/auth (Login &amp; User Provisioning)</text>
        <text x="15" y="82" font-family="monospace" font-size="10" fill="#94a3b8">• /api/watchlist &amp; /api/notifications</text>
        <text x="15" y="100" font-family="monospace" font-size="10" fill="#94a3b8">• ML Proxy &amp; Multipart CSV Streamer</text>
      </g>

      <!-- Database Cluster Box -->
      <g transform="translate(390, 60)">
        <rect x="0" y="0" width="330" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui" font-size="12" font-weight="800" fill="#4ade80">MONGODB ATLAS PERSISTENCE</text>
        <text x="15" y="46" font-family="monospace" font-size="10" fill="#94a3b8">• User Schema (Hashed Bcrypt Passwords)</text>
        <text x="15" y="64" font-family="monospace" font-size="10" fill="#94a3b8">• Watchlist Schema (Personal Flights)</text>
        <text x="15" y="82" font-family="monospace" font-size="10" fill="#94a3b8">• Notification Schema (Directives)</text>
        <text x="15" y="100" font-family="monospace" font-size="10" fill="#94a3b8">• In-Memory Resilient Fallback Layer</text>
      </g>

      <!-- Python Flask ML Box -->
      <g transform="translate(745, 60)">
        <rect x="0" y="0" width="350" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="15" y="24" font-family="system-ui" font-size="12" font-weight="800" fill="#f59e0b">PYTHON FLASK 3.1 ML ENGINE (5001)</text>
        <text x="15" y="46" font-family="monospace" font-size="10" fill="#94a3b8">• POST /predict &amp; POST /predict-bulk</text>
        <text x="15" y="64" font-family="monospace" font-size="10" fill="#94a3b8">• Scikit Random Forest Classifier (100 Trees)</text>
        <text x="15" y="82" font-family="monospace" font-size="10" fill="#94a3b8">• Decision Tree Hold Time Regressor</text>
        <text x="15" y="100" font-family="monospace" font-size="10" fill="#94a3b8">• Sri Lanka / Global Knowledge Resolver</text>
      </g>
    </g>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(40, 790)">
    <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">Flycast Information Architecture Blueprint • Comprehensive RBAC Multi-Tier Orchestration</text>
    <text x="1050" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#0284c7">WIRE_V1.0_APPROVED</text>
  </g>
</svg>
