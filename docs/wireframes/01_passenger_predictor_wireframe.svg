<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <!-- Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="860" fill="#f8fafc"/>
  <rect width="1200" height="860" fill="url(#grid)"/>

  <!-- Top System Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a"/>
  
  <!-- Logo & Title -->
  <g transform="translate(30, 16)">
    <!-- Plane Takeoff Icon Wireframe -->
    <rect x="0" y="4" width="20" height="20" rx="4" fill="#0284c7"/>
    <path d="M 4 14 L 10 8 L 16 12 L 14 16 L 4 14 Z" fill="#ffffff"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">FLYCAST</text>
    <text x="105" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">| Aviation Intelligence Platform</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(420, 22)">
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Home</text>
    <rect x="60" y="-4" width="84" height="28" rx="6" fill="#1e293b"/>
    <text x="72" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Predictor</text>
    <text x="170" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Watchlist</text>
    <text x="260" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Operations Hub</text>
    <text x="385" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Admin</text>
  </g>

  <!-- User Profile Badge -->
  <g transform="translate(1010, 15)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="8" fill="#0284c7"/>
    <text x="32" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">jdoe123 (Passenger)</text>
  </g>

  <!-- Breadcrumbs & Meta Tag Ribbon -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#0284c7"/>
    <text x="24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">WF-01 • SINGLE FLIGHT INFERENCE</text>
    
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Flight Delay Predictor &amp; Trajectory HUD</text>
    <text x="0" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Direct sub-30ms Machine Learning classification and exact hold time projection for scheduled aircraft</text>
  </g>

  <!-- 1-Click Preset Bar -->
  <g transform="translate(700, 82)">
    <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#64748b">1-CLICK TEST PRESETS:</text>
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="150" height="26" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">🇱🇰 UL503 (CMB➔LHR)</text>
      
      <rect x="158" y="0" width="145" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="168" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#334155">🇱🇰 UL225 (CMB➔DXB)</text>
      
      <rect x="310" y="0" width="145" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="320" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#334155">AA123 (JFK➔LAX)</text>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: FORM & ROUTE SIMULATOR ================= -->
  <g transform="translate(40, 180)">
    
    <!-- Component 1: Flight Trajectory HUD Box -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="530" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="530" height="36" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#475569">COMPONENT 1.1: FLIGHT TRAJECTORY HUD</text>
      <text x="375" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#0284c7">CMB ➔ LHR (5,410 mi)</text>

      <!-- Trajectory Graphic -->
      <g transform="translate(30, 60)">
        <!-- Origin Badge -->
        <rect x="0" y="15" width="50" height="50" rx="10" fill="#0284c7"/>
        <text x="11" y="44" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff">CMB</text>
        <text x="8" y="78" font-family="monospace" font-size="9" font-weight="700" fill="#64748b">ORIGIN</text>

        <!-- Arc Wireframe -->
        <path d="M 60 40 Q 235 -20 410 40" fill="none" stroke="#94a3b8" stroke-dasharray="6,4" stroke-width="2"/>
        <path d="M 60 40 Q 150 10 235 10" fill="none" stroke="#0284c7" stroke-width="3"/>
        
        <!-- Plane Vector Icon in flight -->
        <g transform="translate(225, 2)">
          <circle cx="10" cy="10" r="14" fill="#0284c7" opacity="0.2"/>
          <circle cx="10" cy="10" r="8" fill="#0284c7"/>
          <path d="M 6 10 L 14 6 L 14 14 Z" fill="#ffffff"/>
        </g>

        <!-- Destination Badge -->
        <rect x="420" y="15" width="50" height="50" rx="10" fill="#0f172a"/>
        <text x="432" y="44" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff">LHR</text>
        <text x="430" y="78" font-family="monospace" font-size="9" font-weight="700" fill="#64748b">DEST</text>
      </g>
    </g>

    <!-- Component 2: Parameter Input Form Box -->
    <g transform="translate(0, 205)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="530" height="425" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="530" height="36" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#475569">COMPONENT 1.2: INFERENCE PARAMETER INPUT MATRIX</text>

      <!-- Input Field Row 1: Carrier & Flight ID -->
      <g transform="translate(25, 55)">
        <!-- Carrier Code Input -->
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">CARRIER CODE (IATA / ICAO)</text>
        <rect x="0" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="12" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">UL (SriLankan Airlines)</text>
        
        <!-- Flight ID Input -->
        <text x="250" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">FLIGHT IDENTIFIER</text>
        <rect x="250" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="262" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">UL503</text>
      </g>

      <!-- Input Field Row 2: Origin & Destination -->
      <g transform="translate(25, 125)">
        <!-- Origin Airport -->
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">ORIGIN AIRPORT (3-LETTER IATA)</text>
        <rect x="0" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="12" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">CMB (Bandaranaike Intl)</text>
        
        <!-- Dest Airport -->
        <text x="250" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">DESTINATION AIRPORT (IATA)</text>
        <rect x="250" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="262" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">LHR (London Heathrow)</text>
      </g>

      <!-- Input Field Row 3: Departure Date & Scheduled Time -->
      <g transform="translate(25, 195)">
        <!-- Date -->
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">SCHEDULED DATE (YYYY-MM-DD)</text>
        <rect x="0" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="12" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">2026-08-25</text>
        
        <!-- CRS_DEP_TIME -->
        <text x="250" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">DEP TIME (HHMM MILITARY)</text>
        <rect x="250" y="8" width="225" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="262" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">1300 (1:00 PM)</text>
      </g>

      <!-- Input Field Row 4: Distance -->
      <g transform="translate(25, 265)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">GREAT-CIRCLE DISTANCE (STATUTE MILES)</text>
        <rect x="0" y="8" width="475" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="12" y="33" font-family="monospace" font-size="13" font-weight="700" fill="#0f172a">5410 miles</text>
      </g>

      <!-- Submit Inference Button -->
      <g transform="translate(25, 345)">
        <rect x="0" y="0" width="475" height="50" rx="8" fill="url(#skyGrad)"/>
        <text x="140" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">⚡ RUN AI DELAY INFERENCE</text>
        <text x="385" y="30" font-family="monospace" font-size="11" font-weight="600" fill="#bae6fd">&lt;28ms</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INFERENCE RESULTS HUD ================= -->
  <g transform="translate(610, 180)">
    
    <!-- Component 3: Live ML Speedometer & Risk Score Panel -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="550" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="550" height="36" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#475569">COMPONENT 1.3: MACHINE LEARNING SPEEDOMETER HUD</text>
      <circle cx="525" cy="18" r="5" fill="#10b981"/>

      <!-- Gauge Arc Visualizer -->
      <g transform="translate(70, 70)">
        <!-- Outer Track Arc -->
        <path d="M 20 120 A 100 100 0 0 1 220 120" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
        <!-- Active Gauge Arc (38% Value) -->
        <path d="M 20 120 A 100 100 0 0 1 125 24" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round"/>
        
        <!-- Needle Pointer Indicator -->
        <line x1="120" y1="120" x2="125" y2="35" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="120" r="8" fill="#0f172a"/>

        <!-- Center Probability Display -->
        <text x="120" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0f172a">38%</text>
        <text x="120" y="145" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#64748b">DELAY RISK PROBABILITY</text>
      </g>

      <!-- Right Side Readouts: Status & Estimated Hold -->
      <g transform="translate(320, 65)">
        <!-- Risk Badge Status -->
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
        <circle cx="20" cy="21" r="6" fill="#10b981"/>
        <text x="36" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#065f46">ON TIME EXPECTED</text>

        <!-- Hold Duration Card -->
        <rect x="0" y="55" width="200" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">PROJECTED HOLD DURATION</text>
        <text x="14" y="56" font-family="monospace" font-size="24" font-weight="900" fill="#0284c7">0 min</text>
        <text x="14" y="74" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Within scheduled tolerances</text>
      </g>

      <!-- Feature Impact Factors Bar Chart Summary -->
      <g transform="translate(30, 230)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">INFERENCE FEATURE FACTORS BREAKDOWN</text>
        
        <!-- Factor 1: Departure Time Window -->
        <g transform="translate(0, 12)">
          <text x="0" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Time Window (1300 hrs)</text>
          <rect x="180" y="2" width="300" height="12" rx="6" fill="#f1f5f9"/>
          <rect x="180" y="2" width="110" height="12" rx="6" fill="#10b981"/>
          <text x="490" y="12" font-family="monospace" font-size="10" font-weight="700" fill="#10b981">Low Impact</text>
        </g>

        <!-- Factor 2: Route Distance -->
        <g transform="translate(0, 36)">
          <text x="0" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Distance (5,410 miles)</text>
          <rect x="180" y="2" width="300" height="12" rx="6" fill="#f1f5f9"/>
          <rect x="180" y="2" width="160" height="12" rx="6" fill="#f59e0b"/>
          <text x="490" y="12" font-family="monospace" font-size="10" font-weight="700" fill="#f59e0b">Moderate</text>
        </g>

        <!-- Factor 3: Carrier Reliability Profile -->
        <g transform="translate(0, 60)">
          <text x="0" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Carrier Baseline (UL)</text>
          <rect x="180" y="2" width="300" height="12" rx="6" fill="#f1f5f9"/>
          <rect x="180" y="2" width="85" height="12" rx="6" fill="#10b981"/>
          <text x="490" y="12" font-family="monospace" font-size="10" font-weight="700" fill="#10b981">Optimal</text>
        </g>
      </g>
    </g>

    <!-- Component 4: Smart Travel Recommendation & Watchlist Action Card -->
    <g transform="translate(0, 360)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="550" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="550" height="36" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="23" font-family="monospace" font-size="11" font-weight="700" fill="#475569">COMPONENT 1.4: PASSENGER DEPARTURE PLANNER &amp; WATCHLIST</text>

      <!-- Smart Departure Time Calculator -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="500" height="110" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="18" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">SMART TRAVEL DEPARTURE TIME</text>
        <text x="18" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#0c4a6e">10:15 AM</text>
        <text x="150" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0284c7">(Leave home 2h 45m before scheduled 13:00 departure)</text>

        <!-- Sub-timeline breakdown -->
        <g transform="translate(18, 76)">
          <text x="0" y="14" font-family="monospace" font-size="10" font-weight="700" fill="#0369a1">🚗 Transit: 45m</text>
          <text x="120" y="14" font-family="monospace" font-size="10" font-weight="700" fill="#0369a1">🛂 TSA / Customs: 60m</text>
          <text x="275" y="14" font-family="monospace" font-size="10" font-weight="700" fill="#0369a1">⏳ Boarding Gate: 60m</text>
        </g>
      </g>

      <!-- Action Buttons Row -->
      <g transform="translate(25, 185)">
        <!-- Save to Watchlist Button -->
        <rect x="0" y="0" width="240" height="48" rx="8" fill="#0f172a"/>
        <text x="50" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">⭐ Save to Watchlist</text>
        
        <!-- Admin Directive Trigger (Conditionally rendered) -->
        <rect x="255" y="0" width="245" height="48" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="285" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">📢 Dispatch Directive</text>
      </g>
    </g>
  </g>

  <!-- Footer Callout Annotations -->
  <g transform="translate(40, 825)">
    <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">Flycast Blueprint Reference: src/pages/Predictor.jsx • REST API: POST /api/ml/predict • Fast ML Pipeline Latency: &lt;28ms</text>
    <text x="1050" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#0284c7">WIRE_V1.0_APPROVED</text>
  </g>
</svg>
