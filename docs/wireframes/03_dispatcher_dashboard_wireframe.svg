    <circle cx="24" cy="24" r="6" fill="#ef4444"/>
    <text x="40" y="29" font-family="monospace" font-size="12" font-weight="800" fill="#991b1b">🔴 ADMIN EXECUTIVE DIRECTIVE:</text>
    <text x="250" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7f1d1d">Flight UL225 (CMB➔DXB) flagged with 74% delay risk (+35m hold). Action: Pre-emptive Gate Reallocation.</text>
    
    <!-- Action Button inside Ribbon -->
    <rect x="1000" y="10" width="105" height="28" rx="6" fill="#ef4444"/>
    <text x="1015" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">✔ Acknowledge</text>
