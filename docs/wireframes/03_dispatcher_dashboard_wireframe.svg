        <text x="241" y="40" font-family="system-ui" font-size="16" font-weight="700" fill="#0284c7">☁</text>
        <text x="247" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Drag &amp; drop flight_schedule.csv here</text>
