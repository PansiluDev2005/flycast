    <circle cx="12" cy="12" r="4" fill="#0284c7"/>
    <text x="24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1">WF-03 • OPERATIONAL TRIAGE &amp; BATCH ML</text>
    
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Dispatcher Operations Command &amp; Bulk Triage</text>
    <text x="0" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">High-throughput CSV flight schedule ingestion, fleet risk distribution, and pre-emptive gate reallocation</text>
  </g>

  <!-- Component 3.1: Live Executive Directives Ribbon -->
